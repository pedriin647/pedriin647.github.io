<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Nossa Retrospectiva</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --green: #1DB954;
      --purple: #7c3aed;
      --pink: #db2777;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
      color: #fff;
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Palco 9:16 — tela cheia no celular, centralizado no desktop */
    #stage {
      position: relative;
      height: 100dvh;
      width: 100vw;
      max-width: calc(100dvh * 9 / 16);
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }
    @media (min-aspect-ratio: 9/16) {
      #stage { border-radius: 0; box-shadow: 0 0 80px rgba(29,185,84,.15); }
    }

    /* ---------- Slides ---------- */
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center;
      padding: calc(env(safe-area-inset-top) + 64px) 28px calc(env(safe-area-inset-bottom) + 40px);
      opacity: 0;
      transform: translateX(30px) scale(.98);
      transition: opacity .45s var(--ease), transform .45s var(--ease);
      pointer-events: none;
      overflow: hidden;
    }
    .slide.active { opacity: 1; transform: none; pointer-events: auto; }
    .slide.leaving-left  { opacity: 0; transform: translateX(-30px) scale(.98); }
    .slide.leaving-right { opacity: 0; transform: translateX(30px) scale(.98); }

    /* Elementos entram escalonados (efeito Wrapped) */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
    .slide.active .reveal { opacity: 1; transform: none; }
    .slide.active .d1 { transition-delay: .15s; }
    .slide.active .d2 { transition-delay: .35s; }
    .slide.active .d3 { transition-delay: .55s; }
    .slide.active .d4 { transition-delay: .75s; }
    .slide.active .d5 { transition-delay: .95s; }

    /* Fundos */
    .bg-1 { background: radial-gradient(120% 80% at 10% 0%, #1DB954 0%, transparent 55%), radial-gradient(100% 70% at 100% 100%, #7c3aed 0%, transparent 60%), #050505; }
    .bg-2 { background: linear-gradient(160deg, #0b0b0b 0%, #1a0b2e 45%, #7c3aed 100%); }
    .bg-3 { background: linear-gradient(200deg, #db2777 0%, #3b0a2a 50%, #050505 100%); }
    .bg-4 { background: linear-gradient(180deg, #0f3d22 0%, #0a1a10 45%, #050505 100%); }
    .bg-5 { background: radial-gradient(90% 60% at 50% 30%, #4c1d95 0%, transparent 70%), radial-gradient(80% 50% at 50% 100%, #9d174d 0%, transparent 70%), #050505; }

    .blob {
      position: absolute; border-radius: 9999px; filter: blur(60px); opacity: .55;
      animation: float 12s ease-in-out infinite alternate; pointer-events: none; z-index: 0;
    }
    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -60px) scale(1.2); }
    }
    .slide > .content { position: relative; z-index: 1; }

    .mega { font-weight: 900; letter-spacing: -0.04em; line-height: .9; }
    /* Título do slide 1 encolhe para "Retrospectiva" caber em telas estreitas */
    .title-1 { font-size: clamp(2rem, calc((min(100vw, 100dvh * 9 / 16) - 56px) / 9.4), 3.4rem); line-height: .92; }
    .neon-green { color: var(--green); text-shadow: 0 0 30px rgba(29,185,84,.6); }
    .grad-text {
      background: linear-gradient(90deg, #1DB954, #a3e635, #f472b6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .pulse-soft { animation: pulseSoft 2s ease-in-out infinite; }
    @keyframes pulseSoft { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

    .emoji-float { display: inline-block; animation: bob 3s ease-in-out infinite; }
    .emoji-float:nth-child(2) { animation-delay: .4s; }
    .emoji-float:nth-child(3) { animation-delay: .8s; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }

    /* ---------- Barra de progresso (stories) ---------- */
    #progress {
      position: absolute; z-index: 30; left: 10px; right: 10px;
      top: calc(env(safe-area-inset-top) + 10px);
      display: flex; gap: 4px; pointer-events: none;
    }
    .seg { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
    .seg > i { display: block; height: 100%; width: 0; background: #fff; border-radius: 3px; }
    .seg.done > i { width: 100%; }
    .seg.current > i { width: 100%; transition: width .35s var(--ease); }
    .seg.current.timed > i { animation: fillSeg var(--dur) linear forwards; transition: none; }
    @keyframes fillSeg { from { width: 0; } to { width: 100%; } }

    #brand {
      position: absolute; z-index: 30; left: 14px; right: 14px;
      top: calc(env(safe-area-inset-top) + 24px);
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; opacity: .9; pointer-events: none;
    }

    /* ---------- Player ---------- */
    .player {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-radius: 24px; padding: 18px;
      box-shadow: 0 20px 60px rgba(29,185,84,.25);
    }
    .cover {
      width: 100%; aspect-ratio: 1; border-radius: 14px; object-fit: cover;
      background: linear-gradient(135deg, #1DB954, #7c3aed 60%, #db2777);
      box-shadow: 0 16px 40px rgba(0,0,0,.5);
    }
    .track { height: 4px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
    .track > i { display: block; height: 100%; width: 0; background: #fff; border-radius: 4px; }
    .play-btn {
      width: 64px; height: 64px; border-radius: 9999px; background: var(--green); color: #000;
      display: grid; place-items: center; transition: transform .15s;
      box-shadow: 0 0 30px rgba(29,185,84,.55);
    }
    .play-btn:active { transform: scale(.92); }
    .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
    .eq span { width: 3px; background: var(--green); animation: eq 1s ease-in-out infinite; }
    .eq span:nth-child(2) { animation-delay: .2s; } .eq span:nth-child(3) { animation-delay: .4s; }
    @keyframes eq { 0%,100% { height: 30%; } 50% { height: 100%; } }
    .paused .eq span { animation-play-state: paused; }

    /* ---------- Quiz do casal ---------- */
    .bg-quiz { background: radial-gradient(110% 70% at 100% 0%, #06b6d4 0%, transparent 55%), radial-gradient(100% 70% at 0% 100%, #8b5cf6 0%, transparent 60%), linear-gradient(180deg, #1e0b3a, #0a0618); }
    .quiz-q {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 20px; padding: 12px;
    }
    .poll { display: flex; gap: 8px; margin-top: 10px; }
    .opt {
      position: relative; flex: 1; overflow: hidden; height: 44px; border-radius: 14px;
      background: #fff; color: #111; font-weight: 800; font-size: 15px;
      display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px;
      transition: transform .15s, background .3s, color .3s;
    }
    .opt:active { transform: scale(.95); }
    .opt .bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: linear-gradient(90deg, #22d3ee, #a78bfa); opacity: .9;
      transition: width 1s var(--ease);
    }
    .opt .lbl, .opt .pct { position: relative; z-index: 1; }
    .opt .pct { display: none; font-weight: 900; }
    .poll.voted .opt { background: rgba(255,255,255,.12); color: #fff; justify-content: space-between; cursor: default; }
    .poll.voted .opt:active { transform: none; }
    .poll.voted .opt .pct { display: inline; }
    .poll.voted .opt.chosen { box-shadow: 0 0 0 2px #22d3ee, 0 0 24px rgba(34,211,238,.5); }
    .poll.voted .opt.chosen .lbl::after { content: " ✓"; }
    .feedback {
      max-height: 0; opacity: 0; overflow: hidden; margin-top: 0;
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,.85); line-height: 1.35;
      transition: max-height .5s var(--ease), opacity .5s var(--ease), margin-top .5s var(--ease);
    }
    .quiz-q.answered .feedback { max-height: 60px; opacity: 1; margin-top: 8px; }
    /* Telas baixas: compacta o quiz para caber sem rolagem */
    @media (max-height: 700px) {
      .bg-quiz { padding-top: calc(env(safe-area-inset-top) + 54px); padding-bottom: calc(env(safe-area-inset-bottom) + 20px); }
      .bg-quiz h2 { font-size: 1.7rem; margin: 8px 0 10px; }
      .quiz-q { padding: 10px; border-radius: 16px; }
      .quiz-q > p:first-child { font-size: 13.5px; }
      .poll { margin-top: 8px; }
      .opt { height: 38px; font-size: 14px; }
    }
    @media (max-height: 700px) {
      .bg-gal { padding-top: calc(env(safe-area-inset-top) + 54px); padding-bottom: calc(env(safe-area-inset-bottom) + 20px); }
      .bg-gal h2 { font-size: 1.8rem; }
      .bg-gal .gallery { --w: min(240px, 32dvh * .8, 70%); }
    }
    @media (max-height: 640px) {
      .feedback .joke { display: none; }
      .quiz-q.answered .feedback { margin-top: 6px; }
    }
    /* ---------- Galeria de fotos ---------- */
    .bg-gal { background: radial-gradient(100% 60% at 0% 0%, #db2777 0%, transparent 60%), radial-gradient(90% 60% at 100% 100%, #f59e0b 0%, transparent 55%), linear-gradient(180deg, #1c0a2e, #0a0510); }
    .gallery {
      --w: min(240px, 38dvh * .8, 70%);
      --gap: 14px;
      position: relative;
      display: flex; gap: var(--gap);
      margin: 0 -28px; padding: 10px 0 6px;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
      touch-action: pan-x; scrollbar-width: none;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .gallery::before, .gallery::after { content: ""; flex: 0 0 calc(50% - var(--w) / 2 - var(--gap)); }
    .g-item {
      flex: 0 0 var(--w); scroll-snap-align: center;
      transition: transform .4s var(--ease), opacity .4s var(--ease);
      transform: scale(.88); opacity: .5;
    }
    .g-item.on { transform: none; opacity: 1; }
    .g-photo {
      width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block;
      border: 2px solid rgba(255,255,255,.12);
      box-shadow: 0 0 30px rgba(236,72,153,.45), 0 12px 40px rgba(0,0,0,.5);
    }
    .g-item:nth-child(3n+2) .g-photo { box-shadow: 0 0 30px rgba(139,92,246,.5), 0 12px 40px rgba(0,0,0,.5); }
    .g-item:nth-child(3n) .g-photo { box-shadow: 0 0 30px rgba(245,158,11,.45), 0 12px 40px rgba(0,0,0,.5); }
    .g-fallback {
      display: grid; place-items: center; text-align: center;
      background: linear-gradient(145deg, #ec4899, #8b5cf6 55%, #f59e0b);
    }
    .g-nav { width: 36px; height: 36px; border-radius: 9999px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); font-size: 20px; font-weight: 800; display: grid; place-items: center; }
    .g-nav:disabled { opacity: .3; }
    .g-dot { width: 7px; height: 7px; border-radius: 9999px; background: rgba(255,255,255,.35); transition: width .3s var(--ease), background .3s; }
    .g-dot.on { width: 22px; background: linear-gradient(90deg, #ec4899, #f59e0b); }

    .heart {
      position: absolute; z-index: 40; pointer-events: none; font-size: 20px;
      animation: heartUp 1.1s ease-out forwards;
    }
    @keyframes heartUp {
      0%   { transform: translate(0, 0) scale(.4); opacity: 0; }
      20%  { opacity: 1; transform: translate(calc(var(--dx) * .3), -20px) scale(1.1); }
      100% { transform: translate(var(--dx), -110px) scale(.8); opacity: 0; }
    }

    /* ---------- Foto + botão final ---------- */
    .photo {
      width: 72%; max-width: 280px; aspect-ratio: 4/5; object-fit: cover;
      border-radius: 28px; margin: 0 auto;
      background: linear-gradient(135deg, #1DB954, #7c3aed, #db2777);
      box-shadow: 0 0 0 3px rgba(255,255,255,.08), 0 0 40px rgba(29,185,84,.55), 0 0 90px rgba(219,39,119,.45);
    }
    .cta {
      background: linear-gradient(90deg, #1DB954, #22c55e 40%, #ec4899);
      color: #000; font-weight: 900; border-radius: 9999px; padding: 16px 28px;
      box-shadow: 0 10px 40px rgba(236,72,153,.45);
      animation: ctaPulse 2.2s ease-in-out infinite;
    }
    .cta:active { transform: scale(.96); }
    @keyframes ctaPulse { 0%,100% { box-shadow: 0 10px 40px rgba(236,72,153,.45); } 50% { box-shadow: 0 10px 60px rgba(29,185,84,.7); } }

    /* ---------- Modal da carta ---------- */
    #modal {
      position: absolute; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(0,0,0,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transition: opacity .4s var(--ease);
    }
    #modal.open { opacity: 1; pointer-events: auto; }
    #letter {
      width: 100%; max-height: 82dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, #121212, #1a0b1f);
      border: 1px solid rgba(29,185,84,.35);
      border-radius: 24px; padding: 28px 22px;
      box-shadow: 0 0 50px rgba(29,185,84,.3), 0 0 100px rgba(219,39,119,.25);
      transform: translateY(30px) scale(.96); transition: transform .5s var(--ease);
      user-select: text; -webkit-user-select: text; touch-action: pan-y;
    }
    #modal.open #letter { transform: none; }
    #letter p { margin: 0 0 14px; line-height: 1.6; font-weight: 500; color: #e5e5e5; }

    @media (prefers-reduced-motion: reduce) {
      .blob, .emoji-float, .pulse-soft, .cta, .eq span { animation: none !important; }
      .slide, .reveal { transition-duration: .01s !important; transition-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <main id="stage">
    <div id="progress"></div>
    <div id="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#1DB954" aria-hidden="true"><circle cx="12" cy="12" r="12"/><path d="M6.5 9.5c3.8-1.1 8-.8 11 1M7.2 12.6c3.1-.9 6.5-.6 9 .9M7.8 15.5c2.5-.7 5-.5 7 .7" stroke="#000" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      <span id="brandText"></span>
    </div>

    <div id="slides"></div>

    <!-- Áudio de fundo: o src vem do CONFIG.musica.audioSrc -->
    <audio id="bgAudio" preload="none" loop></audio>

    <div id="modal" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
      <div id="letter">
        <div class="flex items-center justify-between mb-5">
          <span class="text-xs font-bold tracking-widest uppercase text-[#1DB954]">Carta Especial</span>
          <button id="closeModal" class="w-9 h-9 rounded-full bg-white/10 grid place-items-center text-lg" aria-label="Fechar">✕</button>
        </div>
        <h2 id="letterTitle" class="mega text-3xl mb-5 grad-text"></h2>
        <div id="letterBody"></div>
        <p id="letterSign" class="!mt-6 !font-extrabold !text-white text-right"></p>
      </div>
    </div>
  </main>

  <script>
  /* ============================================================
     ✏️  EDITE AQUI — todos os textos, números, fotos e música
     ============================================================ */
  const CONFIG = {
    nomeDele: "Pedro",
    nomeDela: "Mel",          // nome dela (aparece na carta)
    dias: 180,
    marca: "Wrapped do Nosso Amor",      // texto pequeno no topo

    // Avanço automático dos slides em ms (0 = desligado, só por toque)
    duracaoSlide: 0,

    slide1: {
      titulo: "Sua Retrospectiva dos 6 Meses",
      subtitulo: "Você passou {dias} dias ao lado do {nomeDele}... Vamos ver seus destaques?",
      dica: "Toque na tela para iniciar",
    },

    slide2: {
      rotulo: "Tempo juntos",
      numero: 4320,                // o número que o contador anima
      prefixo: "+",
      legenda: "horas compartilhadas",
      apoio: "Rolês duvidosos, fofocas alheias, piadas de quinta e a certeza de que valeu a pena cada segundo.",
    },

    slide3: {
      rotulo: "Top Categoria",
      destaque: "Comidas e Lanches",
      emojis: ["🍬", "🍔", "🍟"],
      contadorTitulo: "Incontáveis",
      apoio: "lanches divididos, franguinho, doces e a eterna indecisão sobre o que pedir.",
    },

    musica: {
      tituloSlide: "Música que resume o casal",
      faixa: "Longe De Você",     // ← troque
      artista: "Charlie Brown Jr.",  // ← troque
      capa: "capa.jpeg",                    // ← URL ou caminho da capa (ex: "capa.jpg"); vazio = gradiente
      audioSrc: "musica.mp3",                // ← caminho do áudio (ex: "musica.mp3"); vazio = player simulado
      duracaoSimulada: 214,        // segundos exibidos quando não há áudio
    },

    quiz: {
      rotulo: "Mini Quiz • Dilemas do Casal",
      titulo: "QUEM É MAIS PROVÁVEL DE...",
      opcaoDele: "{nomeDele}",     // texto do botão dele
      opcaoDela: "{nomeDela}",            // texto do botão dela (pode usar "{nomeDela}")
      acertou: "Acertou! 💚",      // quando o voto bate com a maioria
      errou: "Hmm, os dados discordam 👀",
      // dele = % para ele (a % dela é calculada como 100 - dele)
      perguntas: [
        { emoji: "😴", texto: "Se atrasar pra sair de casa?", dele: 2, piada: "Pontualidade é o sobrenome de Pedro." },
        { emoji: "💄", texto: "Demorar 2 horas a mais para se arrumar?", dele: 60, piada: "\"Tava quase pronto...\" 3 horas atrás." },
        { emoji: "📻", texto: "Mandar 15 áudios seguidos pra contar uma fofoca?", dele: 15, piada: "Fofoqueira campeã de bilheteria." },
        { emoji: "🍟", texto: "Ficar com fome 30 minutos depois de comer?", dele: 70, piada: "O estômago tem vida própria." },
      ],
    },

    galeriaFotos: {
      rotulo: "📸 Câmera do Rolo",
      titulo: "MOMENTOS QUE MARCARAM",
      subtitulo: "Um resumo em fotos de alguns dos nossos melhores dias.",
      // 3 a 5 fotos. url = arquivo local (na mesma pasta) ou link externo.
      // Se a foto não existir/carregar, aparece um card de gradiente no lugar.
      galeria: [
        { url: "foto1.jpeg", legenda: "Primeiro date. Bar do Franguinho", data: "Março" },
        { url: "foto2.jpeg", legenda: "Batata no Altas Horas. Um pouco superfaturada kkk", data: "Maio" },
        { url: "foto3.jpeg", legenda: "Seu aniversário. Anos 2000 e com direito a com quem será.", data: "Junho" },
        { url: "foto4.jpeg", legenda: "ZERO31. Voltamos só o pó da rabiola.", data: "Julho" },
        { url: "foto5.jpeg", legenda: "Águas Rio Vermelhenses. Fiquei até cabeludo na foto bicho.", data: "Setembro" },
      ],
    },

    final: {
      titulo: "E o melhor de tudo?",
      subtitulo: "Foi viver tudo isso com você.",
      foto: "nos.jpeg",                    // ← URL ou caminho da foto do casal (ex: "nos.jpg")
      botao: "Abrir Carta Especial 💌",
    },

    carta: {
      titulo: "Feliz 6 meses, Meu Amor!",
      paragrafos: [
        "Não sei verbalizar muito bem, mas sou eternamente grato por ter você na minha vida.",
        "Gosto muito do que estamos construindo juntos, com muito amor e respeito. Amar você é incrível, e quero que saiba que você é a pessoa mais importante da minha vida.",
        "Espero viver a vida com você, temos toda uma jornada pela frente. Amo você ❤️",
      ],
      assinatura: "Com todo amor do universo e região, {nomeDele}",
    },
  };
  /* ============================================================ */

  const fill = (s) => String(s).replace(/\{(\w+)\}/g, (_, k) => CONFIG[k] ?? "");
  const esc = (s) => fill(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (n) => n.toLocaleString("pt-BR");
  const mmss = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

  const M = CONFIG.musica;
  const coverHTML = M.capa
    ? `<img class="cover" src="${esc(M.capa)}" alt="Capa do álbum" />`
    : `<div class="cover grid place-items-center text-6xl">🎵</div>`;
  const photoHTML = CONFIG.final.foto
    ? `<img class="photo block" src="${esc(CONFIG.final.foto)}" alt="Foto do casal" />`
    : `<div class="photo grid place-items-center text-center text-black/70 font-extrabold text-sm px-6">Coloque a foto do casal em<br><code>CONFIG.final.foto</code></div>`;

  const SLIDES = [
    /* 1 — Abertura */
    `<section class="slide bg-1">
      <div class="blob" style="width:260px;height:260px;background:#1DB954;top:-60px;left:-60px"></div>
      <div class="blob" style="width:300px;height:300px;background:#db2777;bottom:-80px;right:-90px;animation-delay:-4s"></div>
      <div class="content">
        <p class="reveal d1 text-sm font-bold tracking-[.25em] uppercase text-white/70 mb-4">${CONFIG.dias} dias • 2026</p>
        <h1 class="reveal d2 mega title-1">${esc(CONFIG.slide1.titulo)}</h1>
        <p class="reveal d3 mt-6 text-lg font-semibold text-white/85 leading-snug">${esc(CONFIG.slide1.subtitulo)}</p>

        ${esc(CONFIG.slide1.dica)} →

    </section>`,

    /* 2 — Tempo */
    `<section class="slide bg-2">
      <div class="blob" style="width:320px;height:320px;background:#7c3aed;bottom:-100px;left:-80px"></div>
      <div class="content">
        <p class="reveal d1 text-sm font-bold tracking-[.25em] uppercase text-[#1DB954] mb-3">${esc(CONFIG.slide2.rotulo)}</p>
        <div class="reveal d2 mega neon-green text-[5.2rem]">${esc(CONFIG.slide2.prefixo)}<span data-counter="${CONFIG.slide2.numero}">0</span></div>
        <p class="reveal d3 mega text-4xl mt-2">${esc(CONFIG.slide2.legenda)}</p>
        <p class="reveal d4 mt-8 text-lg font-semibold text-white/80 leading-snug border-l-4 border-[#1DB954] pl-4">${esc(CONFIG.slide2.apoio)}</p>
      </div>
    </section>`,

    /* 3 — Comida */
    `<section class="slide bg-3">
      <div class="blob" style="width:280px;height:280px;background:#f472b6;top:-40px;right:-80px"></div>
      <div class="content">
        <p class="reveal d1 text-sm font-bold tracking-[.25em] uppercase text-white/70 mb-3">${esc(CONFIG.slide3.rotulo)}</p>
        <h2 class="reveal d2 mega text-[3.6rem]">${esc(CONFIG.slide3.destaque)}</h2>
        <div class="reveal d3 text-6xl my-7 flex gap-4">${CONFIG.slide3.emojis.map((e) => `<span class="emoji-float">${e}</span>`).join("")}</div>
        <div class="reveal d4 rounded-3xl bg-black/40 border border-white/10 p-5 backdrop-blur">
          <p class="mega text-5xl grad-text">${esc(CONFIG.slide3.contadorTitulo)}</p>
          <p class="mt-2 text-base font-semibold text-white/85 leading-snug">${esc(CONFIG.slide3.apoio)}</p>
        </div>
      </div>
    </section>`,

    /* 4 — Trilha sonora */
    `<section class="slide bg-4">
      <div class="blob" style="width:300px;height:300px;background:#1DB954;top:20%;left:-120px;opacity:.35"></div>
      <div class="content">
        <h2 class="reveal d1 mega text-[2.4rem] mb-6">${esc(M.tituloSlide)}</h2>
        <!-- 💡 Prefere o embed do Spotify? Substitua o .player abaixo por:
             <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/SEU_ID" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe> -->
        <div class="reveal d2 player paused" id="player" data-interactive>
          <div class="w-[78%] mx-auto">${coverHTML}</div>
          <div class="mt-5 flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="font-extrabold text-xl truncate">${esc(M.faixa)}</p>
              <p class="text-white/60 font-semibold truncate">${esc(M.artista)}</p>
            </div>
            <div class="eq mt-2"><span></span><span></span><span></span></div>
          </div>
          <div class="mt-4 track"><i id="trackFill"></i></div>
          <div class="mt-1 flex justify-between text-[11px] font-semibold text-white/60">
            <span id="tCur">0:00</span><span id="tDur">${mmss(M.duracaoSimulada)}</span>
          </div>
          <div class="mt-3 flex items-center justify-center gap-8">
            <button class="text-2xl text-white/80" id="prevTrack" aria-label="Voltar ao início">⏮</button>
            <button class="play-btn" id="playBtn" aria-label="Tocar">
              <svg id="icoPlay" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="icoPause" class="hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button class="text-2xl text-white/80" id="nextTrack" aria-label="Avançar 15s">⏭</button>
          </div>
        </div>
      </div>
    </section>`,

    /* 5 — Quiz do casal */
    `<section class="slide bg-quiz">
      <div class="blob" style="width:260px;height:260px;background:#22d3ee;top:-80px;right:-90px;opacity:.4"></div>
      <div class="blob" style="width:280px;height:280px;background:#8b5cf6;bottom:-90px;left:-100px;animation-delay:-5s"></div>
      <div class="content">
        <span class="reveal d1 inline-block text-[11px] font-extrabold tracking-[.2em] uppercase bg-white/10 border border-white/15 rounded-full px-3 py-1 text-cyan-300">${esc(CONFIG.quiz.rotulo)}</span>
        <h2 class="reveal d2 mega text-[2.1rem] mt-3 mb-4">${esc(CONFIG.quiz.titulo)}</h2>
        <div class="flex flex-col gap-3">
          ${CONFIG.quiz.perguntas.map((q, i) => `
          <div class="reveal d${Math.min(i + 3, 5)} quiz-q" data-q="${i}" data-interactive>
            <p class="font-extrabold text-[15px] leading-snug">${q.emoji} ${esc(q.texto)}</p>
            <div class="poll">
              <button class="opt" data-side="dele"><span class="bar"></span><span class="lbl">${esc(CONFIG.quiz.opcaoDele)}</span><span class="pct">0%</span></button>
              <button class="opt" data-side="dela"><span class="bar"></span><span class="lbl">${esc(CONFIG.quiz.opcaoDela)}</span><span class="pct">0%</span></button>
            </div>
            <p class="feedback"></p>
          </div>`).join("")}
        </div>
      </div>
    </section>`,

    /* 6 — Galeria de fotos */
    `<section class="slide bg-gal">
      <div class="blob" style="width:260px;height:260px;background:#ec4899;top:-70px;left:-90px;opacity:.45"></div>
      <div class="blob" style="width:280px;height:280px;background:#f59e0b;bottom:-100px;right:-90px;opacity:.35;animation-delay:-3s"></div>
      <div class="content">
        <span class="reveal d1 inline-block text-[11px] font-extrabold tracking-[.15em] uppercase bg-white/10 border border-white/15 rounded-full px-3 py-1 text-amber-300">${esc(CONFIG.galeriaFotos.rotulo)}</span>
        <h2 class="reveal d2 mega text-[2.2rem] mt-3">${esc(CONFIG.galeriaFotos.titulo)}</h2>
        <p class="reveal d2 text-sm font-semibold text-white/75 mt-2">${esc(CONFIG.galeriaFotos.subtitulo)}</p>
        <div class="reveal d3" id="galWrap" data-interactive>
          <div class="gallery mt-3" id="gallery">
            ${CONFIG.galeriaFotos.galeria.map((f, i) => `
            <figure class="g-item${i === 0 ? " on" : ""}" style="margin:0">
              ${f.url
                ? `<img class="g-photo rounded-2xl" src="${esc(f.url)}" alt="${esc(f.legenda)}" draggable="false" data-fallback="${i}" />`
                : ""}
              <div class="g-photo g-fallback rounded-2xl${f.url ? " hidden" : ""}">
                <div><div class="text-5xl mb-2">📷💖</div><p class="text-xs font-extrabold text-white/90 px-4">Foto ${i + 1}<br>adicione em CONFIG</p></div>
              </div>
              <figcaption class="mt-3 text-center">
                <span class="inline-block text-[10px] font-extrabold tracking-widest uppercase text-amber-300 bg-amber-300/10 rounded-full px-2 py-0.5">${esc(f.data)}</span>
                <p class="mt-1 font-extrabold text-[15px] leading-tight">${esc(f.legenda)}</p>
              </figcaption>
            </figure>`).join("")}
          </div>
          <div class="mt-3 flex items-center justify-center gap-4">
            <button class="g-nav" id="galPrev" aria-label="Foto anterior">‹</button>
            <div class="flex items-center gap-1.5" id="galDots">
              ${CONFIG.galeriaFotos.galeria.map((_, i) => `<button class="g-dot${i === 0 ? " on" : ""}" data-i="${i}" aria-label="Foto ${i + 1}"></button>`).join("")}
            </div>
            <button class="g-nav" id="galNext" aria-label="Próxima foto">›</button>
          </div>
        </div>
      </div>
    </section>`,

    /* 7 — Declaração */
    `<section class="slide bg-5">
      <div class="blob" style="width:260px;height:260px;background:#1DB954;top:10%;left:-100px;opacity:.35"></div>
      <div class="blob" style="width:260px;height:260px;background:#db2777;bottom:5%;right:-100px;opacity:.4;animation-delay:-6s"></div>
      <div class="content text-center">
        <p class="reveal d1 mega text-3xl">${esc(CONFIG.final.titulo)}</p>
        <p class="reveal d2 text-white/75 font-semibold mt-2 mb-6">${esc(CONFIG.final.subtitulo)}</p>
        <div class="reveal d3">${photoHTML}</div>
        <button class="reveal d4 cta mt-8 text-lg" id="openLetter" data-interactive>${esc(CONFIG.final.botao)}</button>
      </div>
    </section>`,
  ];

  /* ---------- Montagem ---------- */
  const slidesEl = document.getElementById("slides");
  const progressEl = document.getElementById("progress");
  const totalSlides = SLIDES.length; // a barra de progresso se ajusta sozinha
  slidesEl.innerHTML = SLIDES.join("");
  progressEl.innerHTML = Array.from({ length: totalSlides }, () => `<div class="seg"><i></i></div>`).join("");
  document.getElementById("brandText").textContent = fill(CONFIG.marca);

  const slides = [...slidesEl.querySelectorAll(".slide")];
  const segs = [...progressEl.querySelectorAll(".seg")];
  let current = 0;
  let autoTimer = null;

  function updateProgress() {
    segs.forEach((s, i) => {
      s.classList.toggle("done", i < current);
      s.classList.remove("current", "timed");
      if (i === current) {
        void s.offsetWidth; // reinicia a animação
        s.classList.add("current");
        if (CONFIG.duracaoSlide > 0) {
          s.style.setProperty("--dur", CONFIG.duracaoSlide + "ms");
          s.classList.add("timed");
        }
      }
    });
  }

  function animateCounter(el) {
    const target = Number(el.dataset.counter);
    const dur = 1600, t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1 && slides[current].contains(el)) requestAnimationFrame(step);
      else el.textContent = fmt(target);
    };
    el.textContent = "0";
    setTimeout(() => requestAnimationFrame(step), 350);
  }

  function goTo(i) {
    if (i < 0 || i >= totalSlides || i === current) return;
    const dir = i > current ? "left" : "right";
    const old = slides[current];
    old.classList.remove("active");
    old.classList.add("leaving-" + dir);
    setTimeout(() => old.classList.remove("leaving-left", "leaving-right"), 460);

    current = i;
    const next = slides[current];
    next.classList.remove("leaving-left", "leaving-right");
    next.style.transform = dir === "left" ? "translateX(30px) scale(.98)" : "translateX(-30px) scale(.98)";
    void next.offsetWidth;
    next.style.transform = "";
    next.classList.add("active");

    next.querySelectorAll("[data-counter]").forEach(animateCounter);
    updateProgress();
    scheduleAuto();
  }

  function scheduleAuto() {
    clearTimeout(autoTimer);
    if (CONFIG.duracaoSlide > 0 && current < totalSlides - 1) {
      autoTimer = setTimeout(() => goTo(current + 1), CONFIG.duracaoSlide);
    }
  }

  const next = () => goTo(current + 1);
  const prev = () => goTo(current - 1);

  /* ---------- Navegação ---------- */
  const stage = document.getElementById("stage");
  const modal = document.getElementById("modal");

  stage.addEventListener("click", (e) => {
    if (modal.classList.contains("open")) return;
    if (e.target.closest("[data-interactive], button, a, audio, iframe")) return;
    const r = stage.getBoundingClientRect();
    (e.clientX - r.left) < r.width * 0.35 ? prev() : next();
  });

  document.addEventListener("keydown", (e) => {
    if (modal.classList.contains("open")) { if (e.key === "Escape") closeLetter(); return; }
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  });

  // Swipe horizontal também funciona
  let tx = null;
  stage.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (tx === null || modal.classList.contains("open")) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 60) { e.preventDefault(); dx < 0 ? next() : prev(); }
  });

  /* ---------- Player ---------- */
  const audio = document.getElementById("bgAudio");
  const player = document.getElementById("player");
  const playBtn = document.getElementById("playBtn");
  const trackFill = document.getElementById("trackFill");
  const tCur = document.getElementById("tCur");
  const tDur = document.getElementById("tDur");
  const hasAudio = !!M.audioSrc;
  if (hasAudio) audio.src = M.audioSrc;

  let playing = false, simTime = 0, simTimer = null;
  const total = () => (hasAudio && isFinite(audio.duration) ? audio.duration : M.duracaoSimulada);

  function renderTime(t) {
    trackFill.style.width = (t / total() * 100) + "%";
    tCur.textContent = mmss(t);
  }

  function setPlaying(on) {
    playing = on;
    player.classList.toggle("paused", !on);
    document.getElementById("icoPlay").classList.toggle("hidden", on);
    document.getElementById("icoPause").classList.toggle("hidden", !on);
    playBtn.setAttribute("aria-label", on ? "Pausar" : "Tocar");
  }

  playBtn.addEventListener("click", () => {
    if (hasAudio) {
      if (audio.paused) audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
      else { audio.pause(); setPlaying(false); }
    } else {
      setPlaying(!playing);
      clearInterval(simTimer);
      if (playing) simTimer = setInterval(() => { simTime = (simTime + 1) % M.duracaoSimulada; renderTime(simTime); }, 1000);
    }
  });
  document.getElementById("prevTrack").addEventListener("click", () => {
    if (hasAudio) audio.currentTime = 0; else { simTime = 0; renderTime(0); }
  });
  document.getElementById("nextTrack").addEventListener("click", () => {
    if (hasAudio) audio.currentTime = Math.min(audio.currentTime + 15, total());
    else { simTime = Math.min(simTime + 15, M.duracaoSimulada - 1); renderTime(simTime); }
  });
  audio.addEventListener("timeupdate", () => renderTime(audio.currentTime));
  audio.addEventListener("loadedmetadata", () => { tDur.textContent = mmss(audio.duration); });

  /* ---------- Quiz ---------- */
  function burstHearts(btn) {
    const s = stage.getBoundingClientRect(), b = btn.getBoundingClientRect();
    const icons = ["💜", "💚", "💖", "✨", "💙"];
    for (let k = 0; k < 8; k++) {
      const h = document.createElement("span");
      h.className = "heart";
      h.textContent = icons[k % icons.length];
      h.style.left = (b.left - s.left + b.width / 2 - 10 + (Math.random() - .5) * b.width * .6) + "px";
      h.style.top = (b.top - s.top) + "px";
      h.style.setProperty("--dx", ((Math.random() - .5) * 80) + "px");
      h.style.animationDelay = (k * 60) + "ms";
      stage.appendChild(h);
      setTimeout(() => h.remove(), 1300 + k * 60);
    }
  }

  function countTo(el, target) {
    const t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, Math.max(0, (t - t0) / 900));
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + "%";
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { el.textContent = target + "%"; }, 1000); // garante o valor final
  }

  document.querySelectorAll(".quiz-q").forEach((card) => {
    const q = CONFIG.quiz.perguntas[Number(card.dataset.q)];
    const pct = { dele: q.dele, dela: 100 - q.dele };
    const poll = card.querySelector(".poll");

    poll.querySelectorAll(".opt").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation(); // não troca de slide
        if (poll.classList.contains("voted")) return;
        const side = btn.dataset.side;
        poll.classList.add("voted");
        btn.classList.add("chosen");
        poll.querySelectorAll(".opt").forEach((o) => {
          o.disabled = true;
          const v = pct[o.dataset.side];
          requestAnimationFrame(() => { o.querySelector(".bar").style.width = v + "%"; });
          countTo(o.querySelector(".pct"), v);
        });
        const majority = pct.dele >= pct.dela ? "dele" : "dela";
        const verdict = side === majority ? CONFIG.quiz.acertou : CONFIG.quiz.errou;
        card.querySelector(".feedback").innerHTML = `<b>${esc(verdict)}</b> <span class="joke">${esc(q.piada)}</span>`;
        card.classList.add("answered");
        burstHearts(btn);
      });
    });
  });

  /* ---------- Galeria ---------- */
  const galWrap = document.getElementById("galWrap");
  const gallery = document.getElementById("gallery");
  const gItems = [...gallery.querySelectorAll(".g-item")];
  const gDots = [...document.querySelectorAll(".g-dot")];
  const galPrev = document.getElementById("galPrev");
  const galNext = document.getElementById("galNext");
  let gIndex = 0;

  // Foto que não carrega → mostra o card de gradiente
  gallery.querySelectorAll("img[data-fallback]").forEach((img) => {
    const swap = () => { img.nextElementSibling.classList.remove("hidden"); img.remove(); };
    img.addEventListener("error", swap);
    if (img.complete && img.naturalWidth === 0) swap();
  });

  // Nenhum toque/arraste/clique dentro da galeria chega à navegação principal
  ["click", "touchstart", "touchmove", "touchend", "pointerdown"].forEach((ev) =>
    galWrap.addEventListener(ev, (e) => e.stopPropagation(), { passive: true })
  );

  function setGal(i) {
    gIndex = i;
    gItems.forEach((it, k) => it.classList.toggle("on", k === i));
    gDots.forEach((d, k) => d.classList.toggle("on", k === i));
    galPrev.disabled = i === 0;
    galNext.disabled = i === gItems.length - 1;
  }

  function galTo(i) {
    i = Math.max(0, Math.min(gItems.length - 1, i));
    const it = gItems[i];
    gallery.scrollTo({ left: it.offsetLeft - (gallery.clientWidth - it.offsetWidth) / 2 });
    setGal(i);
  }

  let galRaf = 0;
  gallery.addEventListener("scroll", () => {
    cancelAnimationFrame(galRaf);
    galRaf = requestAnimationFrame(() => {
      const mid = gallery.scrollLeft + gallery.clientWidth / 2;
      let best = 0, bestD = Infinity;
      gItems.forEach((it, k) => {
        const d = Math.abs(it.offsetLeft + it.offsetWidth / 2 - mid);
        if (d < bestD) { bestD = d; best = k; }
      });
      if (best !== gIndex) setGal(best);
    });
  }, { passive: true });

  galPrev.addEventListener("click", () => galTo(gIndex - 1));
  galNext.addEventListener("click", () => galTo(gIndex + 1));
  gDots.forEach((d) => d.addEventListener("click", () => galTo(Number(d.dataset.i))));
  gItems.forEach((it, k) => it.addEventListener("click", () => galTo(k))); // tocar numa foto lateral centraliza ela
  setGal(0);

  /* ---------- Carta + confetes ---------- */
  document.getElementById("letterTitle").textContent = fill(CONFIG.carta.titulo);
  document.getElementById("letterBody").innerHTML = CONFIG.carta.paragrafos.map((p) => `<p>${esc(p)}</p>`).join("");
  document.getElementById("letterSign").textContent = fill(CONFIG.carta.assinatura);

  function celebrate() {
    if (typeof confetti !== "function") return;
    const colors = ["#1DB954", "#ec4899", "#7c3aed", "#ffffff", "#a3e635"];
    confetti({ particleCount: 90, angle: 60, spread: 70, origin: { x: 0, y: .75 }, colors });
    confetti({ particleCount: 90, angle: 120, spread: 70, origin: { x: 1, y: .75 }, colors });
    setTimeout(() => confetti({ particleCount: 160, spread: 110, startVelocity: 45, origin: { y: .55 }, colors, shapes: ["circle", "square"] }), 300);
    const end = Date.now() + 1500;
    (function frame() {
      confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors });
      confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  function openLetter() {
    clearTimeout(autoTimer);
    celebrate();
    setTimeout(() => modal.classList.add("open"), 450);
  }
  function closeLetter() { modal.classList.remove("open"); }

  document.getElementById("openLetter").addEventListener("click", openLetter);
  document.getElementById("closeModal").addEventListener("click", closeLetter);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeLetter(); });

  /* ---------- Início ---------- */
  slides[0].classList.add("active");
  updateProgress();
  scheduleAuto();
  </script>
</body>
</html>
